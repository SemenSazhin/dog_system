name: Colab sync

on:
  push:
    branches: [master]
    paths: ["**.ipynb", "scripts/**", ".github/workflows/colab-sync.yml"]
  schedule:
    - cron: "*/30 * * * *"   # подтягивать правки, сделанные в Colab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Sync with Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          # при пуше приоритет у репозитория, по расписанию конфликты пропускаются
          if [ "${{ github.event_name }}" = "push" ]; then C=repo; else C=skip; fi
          python scripts/colab_sync.py --on-conflict "$C"

      - name: Commit changes
        run: |
          git config user.name "colab-sync[bot]"
          git config user.email "colab-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: sync notebooks with Colab [skip ci]"
          git pull --rebase
          git push
